<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Diary — Personal Finance Manager</title>
  <meta name="description" content="Track your income, expenses, budgets, and savings goals with Financial Diary.">
  <meta name="theme-color" content="#0a0a0f">

  <!-- Preconnect for faster font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">

    <!-- ================================================================
         SIDEBAR
         ================================================================ -->
    <aside class="sidebar" id="sidebar">

      <!-- ── Logo ── -->
      <div class="sidebar-logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="6" width="24" height="18" rx="3" stroke="currentColor" stroke-width="1.8"/>
          <path d="M2 11h24" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="7" cy="17" r="1.5" fill="currentColor"/>
          <path d="M16 17h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M16 20h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
          <path d="M8 2v4M20 2v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Financial Diary
      </div>

      <!-- ── Navigation ── -->
      <nav class="sidebar-nav" id="sidebar-nav">

        <div class="nav-section-label">Overview</div>

        <!-- Dashboard -->
        <button class="nav-item active" data-view="dashboard">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <rect x="11" y="2" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <rect x="2" y="11" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <rect x="11" y="11" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span class="nav-label">Dashboard</span>
        </button>

        <!-- Analytics -->
        <button class="nav-item" data-view="analytics">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polyline points="3,15 7,10 11,12 17,5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="14,5 17,5 17,8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="3" y1="18" x2="17" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
          </svg>
          <span class="nav-label">Analytics</span>
        </button>

        <div class="nav-section-label">Management</div>

        <!-- Transactions -->
        <button class="nav-item" data-view="transactions">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 3l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3 6h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M6 17l-3-3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 14H3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="nav-label">Transactions</span>
        </button>

        <!-- Budgets -->
        <button class="nav-item" data-view="budgets">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 2.5A7.5 7.5 0 0110 17.5V10H2.5A7.5 7.5 0 0110 2.5z" stroke="currentColor" stroke-width="1.5" fill="none"/>
            <path d="M10 10V2.5A7.5 7.5 0 0117.5 10H10z" fill="currentColor" opacity="0.15"/>
          </svg>
          <span class="nav-label">Budgets</span>
        </button>

        <!-- Savings Goals -->
        <button class="nav-item" data-view="goals">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="10" cy="10" r="5" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="10" cy="10" r="2" fill="currentColor"/>
          </svg>
          <span class="nav-label">Savings Goals</span>
        </button>

        <!-- Recurring -->
        <button class="nav-item" data-view="recurring">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 10a7 7 0 0112.9-3.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M17 10a7 7 0 01-12.9 3.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <polyline points="16,3 16,7 12,7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="4,17 4,13 8,13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Recurring</span>
        </button>

        <div class="nav-section-label">Tools</div>

        <!-- Loans & EMIs -->
        <button class="nav-item" data-view="emis">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="4" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <line x1="5" y1="8" x2="15" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="5" y1="12" x2="11" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="nav-label">Loans & EMIs</span>
        </button>

        <!-- Investments -->
        <button class="nav-item" data-view="investments">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polyline points="3,16 7,9 11,11 15,4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="12,4 15,4 15,7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="3" y1="18" x2="17" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
            <circle cx="7" cy="9" r="1.5" fill="currentColor" opacity="0.4"/>
            <circle cx="11" cy="11" r="1.5" fill="currentColor" opacity="0.4"/>
            <circle cx="15" cy="4" r="1.5" fill="currentColor" opacity="0.6"/>
          </svg>
          <span class="nav-label">Investments</span>
        </button>

        <!-- Trading Desk -->
        <button class="nav-item" data-view="trading">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 3v14M14 3v14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <rect x="3" y="6" width="6" height="8" rx="1" fill="currentColor" stroke="currentColor" stroke-width="1"/>
            <rect x="11" y="5" width="6" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span class="nav-label">Trading Desk</span>
        </button>

        <!-- Validation Lab -->
        <button class="nav-item" data-view="audit">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 3H4a2 2 0 00-2 2v11a2 2 0 002 2h12a2 2 0 002-2v-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M18 3.5L10 11.5l-3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Validation Lab</span>
        </button>

      </nav>

      <!-- ── Sidebar Footer ── -->
      <div class="sidebar-footer">

        <!-- Export Data -->
        <button class="nav-item" id="btn-export">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 3v10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M6 9l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3 15v2a1 1 0 001 1h12a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Export Data</span>
        </button>

        <!-- Import Data (triggers hidden file input) -->
        <button class="nav-item" id="btn-import">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 13V3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M6 7l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3 15v2a1 1 0 001 1h12a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Import Data</span>
        </button>
        <input type="file" id="import-file-input" class="hidden-input" accept=".json">

        <!-- Clear All Data -->
        <button class="nav-item danger-item" id="btn-clear-data">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 5h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M8 5V4a1 1 0 011-1h2a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 5l1 12a1 1 0 001 1h6a1 1 0 001-1l1-12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="8.5" y1="8" x2="8.5" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="11.5" y1="8" x2="11.5" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="nav-label">Clear Data</span>
        </button>

      </div>
    </aside>

    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ================================================================
         MAIN CONTENT
         ================================================================ -->
    <main class="main-content">

      <!-- Mobile hamburger toggle -->
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="3" y1="5" x2="17" y2="5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="3" y1="10" x2="17" y2="10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="3" y1="15" x2="17" y2="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- ── Header ── -->
      <header class="main-header">
        <h1 id="page-title">Dashboard</h1>
        <div class="header-right-side">
          <span class="live-clock" id="global-live-clock">Loading clock...</span>
          <div id="header-actions">
            <!-- Dynamically populated by each view's JS module -->
          </div>
        </div>
      </header>

      <!-- ── View Container (SPA content area) ── -->
      <div id="view-container" class="view-container">
        <!-- Views are rendered here dynamically by JS modules -->
      </div>

    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
      <button class="bottom-nav-item active" data-view="dashboard">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="2" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="11" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>Home</span>
      </button>
      <button class="bottom-nav-item" data-view="transactions">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M14 3l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 6h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M6 17l-3-3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 14H3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Transactions</span>
      </button>
      <button class="bottom-nav-item" data-view="budgets">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.5A7.5 7.5 0 0110 17.5V10H2.5A7.5 7.5 0 0110 2.5z" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span>Budgets</span>
      </button>
      <button class="bottom-nav-item" data-view="analytics">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><polyline points="3,15 7,10 11,12 17,5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="14,5 17,5 17,8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Analytics</span>
      </button>
      <button class="bottom-nav-item" data-view="emis">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><line x1="5" y1="8" x2="15" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>More</span>
      </button>
    </nav>

  </div>

  <!-- ================================================================
       MODAL (global reusable)
       ================================================================ -->
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal-container" id="modal-container">
    <!-- Modal content is dynamically injected by JS -->
  </div>

  <!-- ================================================================
       TOAST CONTAINER (global notifications)
       ================================================================ -->
  <div id="toast-container"></div>

  <!-- ================================================================
       JAVASCRIPT MODULES (loaded in dependency order)
       ================================================================ -->
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/transactions.js"></script>
  <script src="js/budgets.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/recurring.js"></script>
  <script src="js/emis.js"></script>
  <script src="js/stockdb.js"></script>
  <script src="js/investments.js"></script>
  <script src="js/trading.js"></script>
  <script src="js/regime.js"></script>
  <script src="js/selectionEngine.js"></script>
  <script src="js/replayEngine.js"></script>
  <script src="js/portfolioSimulator.js"></script>
  <script src="js/auditEngine.js"></script>
  <script src="js/auditInsights.js"></script>
  <script src="js/auditReport.js"></script>
  <script src="js/audit.js"></script>
  <script src="js/app.js"></script>
  <script src="js/interactive.js"></script>
</body>
</html>
